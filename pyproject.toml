[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "imageright-mcp"
version = "0.0.1"
description = "MCP server that helps AI coding assistants work against Vertafore ImageRight APIs (unofficial)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "manikumarkv" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "imageright", "ai"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.2,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pyyaml>=6",
  "ruff>=0.6",
  "types-PyYAML>=6",
]

[project.scripts]
imageright-mcp = "imageright_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/manikumarkv/imageright-mcp"
Issues = "https://github.com/manikumarkv/imageright-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/imageright_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data/catalog" = "imageright_mcp/_data/catalog"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
