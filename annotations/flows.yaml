# Multi-step recipes (research report §10, F1-F8), in our own words.
# The builder checks every reference: `$stepN.Field` must name a field of an earlier step's output
# type, `$input.name` must be a declared input, and every required parameter must be bound.
#
# Reference rules (also written into flows.json):
#   $input.name     a value supplied by the caller
#   $stepN.Field    a field of step N's result; `value` means the whole result (ids, scalars)
#   When a step returns a list, its `select` says which item(s) later references read.
# Steps are documentation in phase 1; nothing here is executed.

flows:
  - id: F1
    title: Create a workflow task from names
    composite: create_task
    purpose: >-
      Turn a workflow name, a step name, an optional assignee and a file number (optionally
      narrowed to one document) into ids, check the priority against the step's allowed list,
      then create the task. Anything missing or ambiguous is asked of the user, not failed.
    surface: rest-v1
    inputs:
      - name: workflowName
        type: string
        required: true
        meaning: Display name of the workflow.
      - name: stepName
        type: string
        required: true
        meaning: Display name of the step the task should start on.
      - name: description
        type: string
        required: false
        meaning: Optional task description.
      - name: assigneeUsername
        type: string
        required: false
        meaning: Optional user name of the person to assign the task to.
      - name: fileNumber
        type: string
        required: true
        meaning: Number of the file the task is about; the file itself is the target by default.
      - name: targetDocumentType
        type: string
        required: false
        meaning: Optional document type name; when given, the target is a document of this type in the file.
      - name: identifier
        type: string
        required: false
        meaning: Optional document description that picks one document when several share the type.
      - name: priority
        type: int64
        required: false
        default: 5
        meaning: Priority from 1 to 5; must be in the list step 4 returns.
      - name: availableDate
        type: date-time
        required: false
        default: now
        meaning: When the task becomes workable.
    steps:
      - op: GET /api/workflows
        purpose: Find the workflow.
        params: {}
        select: the item whose Name equals $input.workflowName
        onError: >-
          Ask the user: no match means the workflow does not exist or the caller has no rights
          on it; offer the workflow names returned.
      - op: GET /api/workflows/{flowId}/steps
        purpose: Find the starting step inside that workflow.
        params:
          flowId: $step1.Id
          flag: Production
        select: the item whose Name equals $input.stepName
        onError: Ask the user to pick a step when no step name matches; offer the step names returned.
        alternatives:
          - GET /api/workflows/{flowProgName}/{stepProgName}
      - op: GET /api/steps/{stepId}/users
        purpose: Resolve the assignee among the users the step allows.
        optional: only when $input.assigneeUsername is given
        params:
          stepId: $step2.Id
        select: the item whose Name equals $input.assigneeUsername
        onError: >-
          Ask the user when the user name is not among the step's assignable users; offer the
          names returned.
      - op: GET /api/steps/{stepId}/priorities
        purpose: Check that the requested priority (default 5) is permitted on this step.
        params:
          stepId: $step2.Id
        select: $input.priority, which must appear in the list
        onError: Ask the user to choose one of the returned priorities when the requested one is not allowed.
      - op: POST /api/files/find
        purpose: Find the file by its number.
        params:
          FileNumberPart1: $input.fileNumber
        select: the single match; it is the task target unless $input.targetDocumentType is given
        onError: Ask the user when no file matches (unknown file number) or several files match.
      - op: GET /api/containers/{objectId}/allowedtypes
        purpose: Turn the document type name into its id.
        optional: only when $input.targetDocumentType is given
        params:
          objectId: $step5.Id
        select: the item whose Name equals $input.targetDocumentType
        onError: Ask the user when the file does not accept a document type of that name.
      - op: POST /api/documents/find
        purpose: List the file's documents of that type and pick the target document.
        optional: only when $input.targetDocumentType is given
        params:
          FileId: $step5.Id
          DocumentTypeIds: [$step6.Id]
        select: >-
          exactly one document -> it is the target; several and $input.identifier given -> the
          single document whose Description equals $input.identifier; several without an
          identifier -> ask the user to pick
        onError: >-
          Ask the user: zero documents means the file has no documents of that type; several
          documents with no Description matching the identifier means the user must refine it.
      - op: POST /api/tasks
        purpose: Create the task.
        params:
          ObjectId: $step7.Id when a document type was given, otherwise $step5.Id
          StepId: $step2.Id
          Priority: $input.priority
          AvailableDate: $input.availableDate
          UserId: $step3.Id
          Description: $input.description
        onError: Priority or assignee outside the step's lists are the usual causes of a rejection.
    outputs:
      taskId: $step8.Id
      stepId: $step2.Id
    notes:
      - Missing or unresolvable data (unknown workflow, step, user or file, ambiguous document) makes the composite ask the user for that piece (needs-input) rather than fail.
      - UserId is the assignee's user id (AssigneeId in the composite); leave it out when no assignee is given.
      - Using the diary step instead of a regular step creates a diary entry rather than a task.

  - id: F2
    title: Act on a task under a lock
    purpose: Lock a task, pick the next step from its outgoing links, route it there, and unlock.
    surface: rest-v1
    inputs:
      - name: taskId
        type: int64
        required: true
        meaning: Task to act on (see flow F7 to find it).
      - name: targetStepName
        type: string
        required: true
        meaning: Name or label of the step to send the task to.
      - name: assigneeId
        type: int64
        required: false
        meaning: Optional user who gets the task on the new step.
    steps:
      - op: POST /api/tasks/{taskId}/lock
        purpose: Take the lock and read the task's current step.
        params:
          taskId: $input.taskId
          returnTask: true
        onError: If another user holds the lock, stop and report who (LockedBy).
      - op: GET /api/steps/{srcStepId}/links
        purpose: List where the task may go from its current step.
        params:
          srcStepId: $step1.StepId
        select: the link whose Label or target step matches $input.targetStepName
      - op: POST /api/tasks/{taskId}/route
        purpose: Send the task to the chosen step.
        params:
          taskId: $input.taskId
          stepId: $step2.TargetStepId
          userId: $input.assigneeId
          commit: true
        alternatives:
          - POST /api/tasks/{taskId}/release
          - POST /api/tasks/{taskId}/cancel
          - POST /api/tasks/{taskId}/attributes/{attrId}
      - op: POST /api/tasks/{taskId}/unlock
        purpose: Release the lock, also when step 3 failed.
        params:
          taskId: $input.taskId
    outputs:
      task: $step1.Id
    notes:
      - For long work, call POST /api/tasks/{taskId}/refresh to keep the lock alive.
      - A route or release commits by default; commit=false is a trial run.

  - id: F3
    title: Ingest a document page by page
    purpose: >-
      Locate the file, check which document types it accepts, create the document, open a
      capture batch and upload each page image.
    surface: rest-v1
    inputs:
      - name: fileNumber
        type: string
        required: true
        meaning: First part of the number of the file that receives the document.
      - name: documentTypeName
        type: string
        required: true
        meaning: Name of the document type to create.
      - name: description
        type: string
        required: true
        meaning: Label for the new document.
      - name: documentDate
        type: date
        required: true
        meaning: Business date of the document.
      - name: application
        type: ApiApplicationId
        required: true
        default: WebSdk
        meaning: Capturing application recorded on the batch.
      - name: pageFiles
        type: file[]
        required: true
        meaning: Page images in order, one file per page (splitting a PDF is phase 2).
    steps:
      - op: POST /api/files/find
        purpose: Find the file by its number.
        params:
          FileNumberPart1: $input.fileNumber
        select: the single match; zero or several matches need a human decision
        alternatives:
          - POST /api/files
      - op: GET /api/containers/{objectId}/allowedtypes
        purpose: List the document types this file's template permits.
        params:
          objectId: $step1.Id
        select: the item whose Name equals $input.documentTypeName
      - op: POST /api/documents
        purpose: Create the empty document.
        params:
          ParentId: $step1.Id
          DocumentTypeId: $step2.Id
          Description: $input.description
          DocumentDate: $input.documentDate
      - op: POST /api/batches
        purpose: Open a real capture batch for the pages.
        params:
          Application: $input.application
      - op: POST /api/pages
        purpose: Upload one page.
        repeat: once per entry of $input.pageFiles, in order
        params:
          DocId: $step3.value
          BatchId: $step4.value
          PageCreateData: {docId: $step3.value, batchId: $step4.value}
          image0: $input.pageFiles
        alternatives:
          - POST /api/v2/pages
    outputs:
      documentId: $step3.value
      batchId: $step4.value
      pageId: $step5.Id
    notes:
      - To place the document in a folder, find the folder with POST /api/folders/find and use it as ParentId.
      - If a page upload fails midway, the document holds the pages uploaded so far; phase 2 decides on cleanup.

  - id: F4
    title: Replace a page's image under a lock
    purpose: Lock a page, upload new image content as a new version, and unlock.
    surface: rest-v1
    inputs:
      - name: pageId
        type: int64
        required: true
        meaning: Page to update.
      - name: documentId
        type: int64
        required: true
        meaning: Document the page belongs to (PageModel.DocumentId).
      - name: imageFile
        type: file
        required: true
        meaning: New image for the page.
    steps:
      - op: GET /api/pages/{pageId}/lock
        purpose: Take the page lock.
        params:
          pageId: $input.pageId
        alternatives:
          - GET /api/v2/pages/{pageId}/lock
      - op: POST /api/pages/{pageId}/content
        purpose: Upload the new image.
        params:
          pageId: $input.pageId
          PageUpdateData: {documentId: $input.documentId}
          image0: $input.imageFile
        alternatives:
          - POST /api/v2/pages/{pageId}/content
      - op: GET /api/pages/{pageId}/unlock
        purpose: Release the lock, also when step 2 failed.
        params:
          pageId: $input.pageId
    outputs: {}
    notes:
      - The lock only lasts about 30 seconds; refresh it every 10 seconds with GET /api/pages/{pageId}/refresh during slow uploads.
      - The REST v2 content call names its parts image and annotation instead of image0.

  - id: F5
    title: Move all documents from one file to another
    purpose: List the documents of a source file and move them into a target file in one call.
    surface: rest-v1
    inputs:
      - name: sourceFileId
        type: int64
        required: true
        meaning: File to take the documents from.
      - name: targetContainerId
        type: int64
        required: true
        meaning: File or folder that receives them.
    steps:
      - op: POST /api/documents/find
        purpose: Collect the documents of the source file.
        params:
          FileId: $input.sourceFileId
          Deleted: false
        select: all items
      - op: POST /api/documents/move
        purpose: Move them.
        params:
          DocumentIds: $step1.Id
          TargetParentId: $input.targetContainerId
        alternatives:
          - POST /api/v2/documents/move
          - POST /api/v2/documents/copy
        onError: Check FailedDocumentMoves in the result; the call can partly succeed.
    outputs:
      documentIdMap: $step2.DocumentIdMap
      pageIdMap: $step2.PageIdMap
    notes:
      - Folders move with POST /api/folders/move and pages with POST /api/pages/move or the v2 page move, copy and merge calls.
      - Merging two whole files is POST /api/files/{sourceFileId}/merge, which cannot be undone.
      - Deleting pages or documents in bulk is POST /api/files/{fileId}/instances/delete (all or nothing).

  - id: F6
    title: Add a note to a file, folder or task
    purpose: Make sure the note collection exists, lock it at its current version, append a note, and unlock.
    surface: rest-v1
    inputs:
      - name: objectId
        type: int64
        required: true
        meaning: File, folder or task that gets the note.
      - name: category
        type: NoteCategory
        required: true
        default: Regular
        meaning: Kind of note collection.
      - name: text
        type: string
        required: true
        meaning: The note text.
    steps:
      - op: GET /api/objects/{objectId}/notes/{category}
        purpose: Read the collection to learn its version (an Id of -1 means there is none yet).
        params:
          objectId: $input.objectId
          category: $input.category
        select: the first item
      - op: POST /api/objects/{objectId}/notes/{category}
        purpose: Create the collection when step 1 found none.
        optional: only when step 1 returned Id -1
        params:
          objectId: $input.objectId
          category: $input.category
      - op: POST /api/objects/{objectId}/notes/{category}/lock
        purpose: Lock the collection at the version just read.
        params:
          objectId: $input.objectId
          category: $input.category
          version: $step1.Version
      - op: POST /api/objects/{objectId}/notes
        purpose: Append the note.
        params:
          objectId: $input.objectId
          Category: $input.category
          Text: $input.text
      - op: POST /api/objects/{objectId}/notes/{category}/unlock
        purpose: Release the lock, also when step 4 failed.
        params:
          objectId: $input.objectId
          category: $input.category
    outputs:
      noteItemId: $step4.ItemId
    notes:
      - When step 2 ran, lock with the Version it returned instead of step 1's.

  - id: F7
    title: Find content, then act on it
    purpose: Resolve a file number to a file, its documents and their pages, producing ids for the other flows.
    surface: rest-v1
    inputs:
      - name: fileNumber
        type: string
        required: true
        meaning: First part of the file number.
      - name: documentTypeIds
        type: int64[]
        required: false
        meaning: Optional document types to narrow the search.
    steps:
      - op: POST /api/files/find
        purpose: Find the file.
        params:
          FileNumberPart1: $input.fileNumber
        select: the single match
      - op: POST /api/documents/find
        purpose: Find documents in it.
        params:
          FileId: $step1.Id
          DocumentTypeIds: $input.documentTypeIds
        select: the document(s) of interest
      - op: GET /api/documents/{docId}/pages
        purpose: List the pages of a chosen document.
        params:
          docId: $step2.Id
    outputs:
      fileId: $step1.Id
      documentId: $step2.Id
      pageId: $step3.Id
    notes:
      - Tasks are found with GET /api/tasks or POST /api/tasks/find and then handled with F2.
      - To walk upwards from any object, use the pathToFile calls.

  - id: F8
    title: Create a task over SOAP
    purpose: >-
      The SOAP version of F1: open a session, resolve workflow, step and assignee, create the
      task, read it back and close the session.
    surface: soap
    inputs:
      - name: username
        type: string
        required: true
        meaning: Login name (case-sensitive), from configuration.
      - name: password
        type: string
        required: true
        meaning: Password (case-sensitive), from configuration only.
      - name: connection
        type: string
        required: true
        meaning: Connection name (case-sensitive).
      - name: workflowName
        type: string
        required: true
        meaning: Display name of the workflow.
      - name: stepName
        type: string
        required: true
        meaning: Display name of the step.
      - name: targetObjectId
        type: long
        required: true
        meaning: File, folder or document the task is about.
      - name: priority
        type: long
        required: true
        meaning: Task priority.
      - name: availableDate
        type: dateTime
        required: true
        meaning: When the task becomes workable.
    steps:
      - op: soap:UserLogin
        purpose: Open the session; the result is the first security token.
        params:
          username: $input.username
          password: $input.password
          connName: $input.connection
      - op: soap:GetFlows
        purpose: Find the workflow.
        params: {}
        select: the item whose Name equals $input.workflowName
      - op: soap:GetSteps
        purpose: Find the step in it.
        params:
          flowRef: $step2.Id
          requestFlag: Both
        select: the item whose Name equals $input.stepName
      - op: soap:GetAuthorizedUsersForStep
        purpose: Pick an assignee among the users allowed on the step.
        optional: only when an assignee is wanted
        params:
          stepRef: $step3.Id
          stepPermission: All
      - op: soap:CreateTask
        purpose: Create the task.
        params:
          objId: $input.targetObjectId
          stepRef: $step3.Id
          createData.Priority: $input.priority
          createData.Available: $input.availableDate
          createData.AssignedTo: $step4.User.SecurityAccount.Id
      - op: soap:GetTaskByRef
        purpose: Read the new task back.
        params:
          taskRef: $step5.value
      - op: soap:UserLogoff
        purpose: Close the session.
        params: {}
    outputs:
      taskRef: $step5.value
      task: $step6.value
    notes:
      - Every response carries a new security token; each call must send the token from the previous response.
      - Acting on the task follows LockTask, then RouteTask, ReleaseTask, ReleaseTaskToStep, SetTaskAttribute, UpdateTask or KillTask, then UnlockTask.

  - id: F8b
    title: Ingest pages over SOAP
    purpose: The SOAP version of F3's upload part - open a batch and add pages to an existing document.
    surface: soap
    inputs:
      - name: username
        type: string
        required: true
        meaning: Login name (case-sensitive), from configuration.
      - name: password
        type: string
        required: true
        meaning: Password (case-sensitive), from configuration only.
      - name: connection
        type: string
        required: true
        meaning: Connection name (case-sensitive).
      - name: documentRef
        type: DocumentRef
        required: true
        meaning: Document that receives the pages.
      - name: applicationId
        type: int
        required: true
        meaning: Numeric id of the capturing application.
      - name: pageImages
        type: ImageList[]
        required: true
        meaning: One image list per page, in order.
    steps:
      - op: soap:UserLogin
        purpose: Open the session.
        params:
          username: $input.username
          password: $input.password
          connName: $input.connection
      - op: soap:CreateBatch
        purpose: Open a capture batch.
        params:
          applicationId: $input.applicationId
      - op: soap:AddPage
        purpose: Add one page.
        repeat: once per entry of $input.pageImages, in order
        params:
          documentRef: $input.documentRef
          imageList: $input.pageImages
          batchId: $step2.value
          archiveImmediately: false
      - op: soap:UserLogoff
        purpose: Close the session.
        params: {}
    outputs:
      batchId: $step2.value
      page: $step3.value
    notes:
      - AddConvertedPage accepts a batch id of -1 to create a batch on the fly; whether phase 2 needs it is still open.

  - id: F9
    title: Search files by number, pattern or drawer
    composite: search_files
    purpose: >-
      Find the files that match any combination of number, number pattern, drawer and
      temporary/deleted state. The results feed other composites, for example F1's fileNumber
      or F5's source and target.
    surface: rest-v1
    inputs:
      - name: fileNumber
        type: string
        required: false
        meaning: >-
          Exact first part of the file number (FileNumberPart1). Either this or filePattern is
          required.
      - name: filePattern
        type: string
        required: false
        meaning: >-
          SQL LIKE pattern on the first part of the file number, with % as the wildcard (e.g.
          TEMP%). Either this or fileNumber is required.
      - name: drawerCode
        type: string
        required: false
        meaning: Optional drawer code that limits the search to one drawer.
      - name: isTemp
        type: boolean
        required: false
        default: false
        meaning: >-
          Tri-state. true or false filters on temporary files; an explicit null does not filter.
      - name: isDeleted
        type: boolean
        required: false
        default: false
        meaning: >-
          Tri-state. true or false filters on deleted files; an explicit null does not filter.
    steps:
      - op: GET /api/drawers
        purpose: Turn the drawer code into the drawer id.
        optional: only when $input.drawerCode is given
        params: {}
        select: the item whose Name (the drawer code) equals $input.drawerCode
        onError: >-
          Ask the user when no drawer has that code; offer the drawer codes returned.
      - op: POST /api/files/find
        purpose: Search for the files.
        params:
          FileNumberPart1: $input.fileNumber when given, otherwise $input.filePattern
          ParentId: $step1.Id when $input.drawerCode is given, otherwise left out
          IsTemporary: $input.isTemp, left out when null
          IsDeleted: $input.isDeleted, left out when null
        select: >-
          all items, returned as the FileDataResult list; zero matches is a normal empty result,
          not an error
        onError: >-
          A call with neither $input.fileNumber nor $input.filePattern is rejected before this
          step as needs-input (ask the user for one of them). Validation needed - whether the
          server honours % wildcards in FileNumberPart1 is unconfirmed against a real server.
    outputs:
      files: $step2.value
    notes:
      - fileNumber or filePattern is required; a call with neither is rejected as needs-input and no request is sent.
      - FileNumberPart2 and FileNumberPart3 are never sent.
      - Zero matches returns an empty list, not an error.
      - Validation needed - whether the server honours % wildcards in FileNumberPart1 has not been confirmed against a real server.

  - id: F10
    title: Create a file in a drawer
    composite: create_file
    purpose: >-
      Create a new file under a drawer, with duplicate protection. The drawer code and the file
      type name are turned into ids, and a file number that is already in use is rejected
      before anything is written.
    surface: rest-v1
    inputs:
      - name: drawerCode
        type: string
        required: true
        meaning: Code of the drawer that receives the new file.
      - name: description
        type: string
        required: true
        meaning: Label for the new file; sent as its Name.
      - name: fileType
        type: string
        required: true
        meaning: Name of the file type to create.
      - name: fileNumber
        type: string
        required: false
        meaning: >-
          Optional first part of the file number (FileNumberPart1), sent exactly as given with no
          pattern handling. When left out, the server generates it from the file type's number
          format.
      - name: createdByApplication
        type: string
        required: true
        meaning: Free-text name of the creating application, supplied by the user and recorded for auditing.
      - name: isTemporary
        type: boolean
        required: false
        default: false
        meaning: Marks the new file as temporary.
    steps:
      - op: GET /api/drawers
        purpose: Turn the drawer code into the drawer id.
        params: {}
        select: the item whose Name (the drawer code) equals $input.drawerCode
        onError: >-
          Ask the user when no drawer has that code; offer the drawer codes returned.
      - op: GET /api/objecttypes/{standardObjectClass}
        purpose: Turn the file type name into its id.
        params:
          standardObjectClass: File
        select: the item whose Name equals $input.fileType
        onError: >-
          Ask the user when no file type has that name; present the full list of file type names
          returned.
      - op: POST /api/files/find
        purpose: Make sure the file number is not already in use.
        optional: only when $input.fileNumber is given
        params:
          FileNumberPart1: $input.fileNumber
        select: >-
          any match means the number is taken; the flow stops with an error and nothing is
          created
        onError: >-
          A duplicate file number is an error, not a question - the create step is never reached.
      - op: POST /api/files
        purpose: Create the file.
        params:
          FileTypeId: $step2.Id
          ParentId: $step1.Id
          Name: $input.description
          FileNumberPart1: $input.fileNumber, left out when not given
          IsTemporary: $input.isTemporary
          CreatedByApplication: $input.createdByApplication
        onError: >-
          A file number that does not fit the file type's number format is the usual cause of a
          rejection.
    outputs:
      fileId: $step4.value
    notes:
      - Drawers have no separate code field; the drawer code is assumed to be the drawer's Name, as in F9.
      - A file number that matches an existing file is rejected as an error (duplicate protection); the file is not created.
      - FileNumberPart1 is sent exactly as given; FileNumberPart2 and FileNumberPart3 are never sent. Without a fileNumber the server generates the number.
      - The create step is a write, so the standard write policy applies - previewed under writeMode dry-run, blocked under deny, sent under allow.

  - id: F11
    title: Update a file's number and/or description
    composite: update_file
    purpose: >-
      Rename a file's number and/or description, with duplicate protection. The file is found by
      its current number, and a new number that another file already uses is rejected before
      anything is written.
    surface: rest-v1
    inputs:
      - name: fileNumber
        type: string
        required: true
        meaning: >-
          Current first part of the file number (FileNumberPart1), used only to find the file.
      - name: newFileNumber
        type: string
        required: false
        meaning: >-
          New first part of the file number (FileNumberPart1). Either this or newDescription is
          required.
      - name: newDescription
        type: string
        required: false
        meaning: New label for the file; sent as its Name. Either this or newFileNumber is required.
    steps:
      - op: POST /api/files/find
        purpose: Find the file to update.
        params:
          FileNumberPart1: $input.fileNumber
        select: the single match; its Id is the file to update
        onError: >-
          Ask the user when nothing matches (wrong number?). Ask the user to pick one when more
          than one file matches.
      - op: POST /api/files/find
        purpose: Make sure the new file number is not already in use by another file.
        optional: only when $input.newFileNumber is given
        params:
          FileNumberPart1: $input.newFileNumber
        select: >-
          any match whose Id differs from $step1.Id means the number is taken; the flow stops
          with an error and nothing is updated
        onError: >-
          A duplicate file number is an error, not a question - the update step is never reached.
      - op: POST /api/files/{fileId}/properties
        purpose: Update the file's number and/or description.
        params:
          fileId: $step1.Id
          FileNumberPart1: $input.newFileNumber, left out when not given
          Name: $input.newDescription, left out when not given
        onError: >-
          A file number that does not fit the file type's number format is the usual cause of a
          rejection.
    outputs:
      fileId: $step1.Id
    notes:
      - newFileNumber or newDescription is required; a call with neither is rejected as needs-input and no request is sent.
      - Scope is the file number and description only; drawer, file type and attribute changes are not part of this flow.
      - A new file number that matches a different existing file is rejected as an error (duplicate protection); the file is not updated.
      - FileNumberPart1 is sent exactly as given; FileNumberPart2 and FileNumberPart3 are never sent.
      - The update step is a write, so the standard write policy applies - previewed under writeMode dry-run, blocked under deny, sent under allow.
      - The update call returns no body, so the flow outputs the id of the updated file (from step 1); fetch the file again to see its new values.

  - id: F12
    title: Merge one file into another
    composite: merge_files
    purpose: >-
      Merge a source file's content into a target file. Both files are found by their file
      number; the source file is gone afterwards and only the target remains. This is destructive
      and cannot be undone.
    surface: rest-v1
    inputs:
      - name: sourceFileNumber
        type: string
        required: true
        meaning: >-
          First part of the file number (FileNumberPart1) of the file that is merged away.
      - name: targetFileNumber
        type: string
        required: true
        meaning: >-
          First part of the file number (FileNumberPart1) of the file that survives and receives
          the content.
    steps:
      - op: POST /api/files/find
        purpose: Find the source file.
        params:
          FileNumberPart1: $input.sourceFileNumber
        select: the single match; its Id is the source file
        onError: >-
          No match is an error, not a question - the flow stops with IR-4001 (ObjectNotFound,
          "no file has number <sourceFileNumber>") and nothing is merged. More than one match is
          also an error - the flow stops with IR-4001 ("file number <sourceFileNumber> matches
          more than one file") rather than guessing which file to merge away.
      - op: POST /api/files/find
        purpose: Find the target file.
        params:
          FileNumberPart1: $input.targetFileNumber
        select: the single match; its Id is the target file
        onError: >-
          No match is an error, not a question - the flow stops with IR-4001 (ObjectNotFound,
          "no file has number <targetFileNumber>") and nothing is merged. More than one match is
          also an error - the flow stops with IR-4001 ("file number <targetFileNumber> matches
          more than one file") rather than guessing which file receives the content.
      - op: POST /api/files/{sourceFileId}/merge
        purpose: Merge the source file into the target file.
        params:
          sourceFileId: $step1.Id
          targetFileId: $step2.Id
        onError: >-
          Nothing is merged when the call is rejected; check that both files still exist and that
          the caller may modify them.
    outputs:
      fileId: $step2.Id
    notes:
      - Destructive - the source file is gone after the merge and this cannot be undone.
      - Both lookups must resolve to exactly one file; no match or more than one match is an error (IR-4001) and the merge step is never reached. The user is not asked to pick.
      - The request body of the merge call is just the target file id as a bare JSON number.
      - The merge step is a destructive write, so the standard write policy applies - previewed under writeMode dry-run (nothing is sent), blocked under deny, sent under allow; and because it is destructive it also needs explicit confirmation (confirm=<previewId> from a prior preview, while requireConfirm is on, the default).
      - The merge call returns no body, so the flow outputs the id of the target file (from step 2); fetch the file again to see its merged content.

  - id: F13
    title: Move or copy file content by document type
    composite: move_file_content
    purpose: >-
      Transfer documents from a source file to a target file, optionally only those of certain
      document types, by moving or copying them. The source file itself always stays in place -
      a move leaves it empty, a copy leaves it untouched. Unlike F12 (merge), nothing is deleted.
    surface: rest-v1
    inputs:
      - name: sourceFileNumber
        type: string
        required: true
        meaning: >-
          First part of the file number (FileNumberPart1) of the file the documents come from.
      - name: targetFileNumber
        type: string
        required: true
        meaning: >-
          First part of the file number (FileNumberPart1) of the file that receives the documents.
      - name: documentTypes
        type: string[]
        required: false
        default: [All]
        meaning: >-
          Document type codes to transfer. The default ["All"] means no filtering (every
          document). "All" must be the only entry - a list that mixes "All" with specific codes
          is rejected as invalid input before any request is sent.
      - name: mode
        type: string
        required: false
        default: copy
        meaning: >-
          Either "move" or "copy" (the default); any other value is rejected as invalid input
          before any request is sent.
    steps:
      - op: POST /api/files/find
        purpose: Find the source file.
        params:
          FileNumberPart1: $input.sourceFileNumber
        select: the single match; its Id is the source file
        onError: >-
          No match is an error, not a question - the flow stops with IR-4001 (ObjectNotFound,
          "no file has number <sourceFileNumber>") and nothing is transferred. More than one
          match is also an error - the flow stops with IR-4001 ("file number <sourceFileNumber>
          matches more than one file") rather than guessing which file to take documents from.
      - op: POST /api/files/find
        purpose: Find the target file.
        params:
          FileNumberPart1: $input.targetFileNumber
        select: the single match; its Id is the target file
        onError: >-
          No match is an error, not a question - the flow stops with IR-4001 (ObjectNotFound,
          "no file has number <targetFileNumber>") and nothing is transferred. More than one
          match is also an error - the flow stops with IR-4001 ("file number <targetFileNumber>
          matches more than one file") rather than guessing which file receives the documents.
      - op: POST /api/documents/find
        purpose: Collect the source file's documents and keep the ones of the requested types.
        params:
          FileId: $step1.Id
          Deleted: false
        select: >-
          all items when $input.documentTypes is ["All"], otherwise only the documents whose
          document type code is in $input.documentTypes; their Ids are the documents to transfer.
          Validation needed - DocumentDataResult carries DocumentTypeId and
          DocumentTypeDescription but no type code field, so how a code is matched against a
          found document is unconfirmed.
        onError: >-
          When no document is left after filtering, the flow stops before the write step and
          reports that there is nothing to transfer (an empty result, not an error).
      - op: POST /api/documents/move
        purpose: Move the selected documents into the target file.
        optional: only when $input.mode is move
        params:
          DocumentIds: $step3.Id
          TargetParentId: $step2.Id
        alternatives:
          - POST /api/v2/documents/move
        onError: >-
          The call can partly succeed. Check FailedDocumentMoves (and Error) in the result and
          report every document that failed alongside the ones that moved - never drop failures
          silently.
      - op: POST /api/v2/documents/copy
        purpose: Copy the selected documents into the target file.
        optional: only when $input.mode is copy
        params:
          DocumentIds: $step3.Id
          TargetId: $step2.Id
        onError: >-
          The call can partly succeed. Check FailedObjects in the result and report every
          document that failed alongside the ones that were copied - never drop failures
          silently.
    outputs:
      moveResult: $step4.value
      copyResult: $step5.value
    notes:
      - Both lookups must resolve to exactly one file; no match or more than one match is an error (IR-4001) and no document is transferred. The user is not asked to pick.
      - The source file is never deleted. Move mode relocates its documents and leaves the file empty; copy mode leaves it untouched.
      - Exactly one of steps 4 and 5 runs, chosen by mode, so exactly one of moveResult (DocumentMoveResult) and copyResult (DocumentActionResult) is set. Both carry DocumentIdMap and PageIdMap (old id to new id).
      - Copying only exists in REST v2 (POST /api/v2/documents/copy); there is no v1 copy call. Moving uses the v1 call, with POST /api/v2/documents/move as the version alternative.
      - The copy step leaves CopyOption out, so the server's default copy kind applies (Logical reference or physical copy). Validation needed - that default is unconfirmed.
      - Validation needed - document type matching is by type code, not name, but a found document only carries DocumentTypeId and DocumentTypeDescription. Turning codes into DocumentTypeIds (e.g. from GET /api/objecttypes/{standardObjectClass} with Document) and filtering on those is a likely route, but it is unconfirmed which object type field holds the code.
      - The move or copy step is a write, so the standard write policy applies - previewed under writeMode dry-run (nothing is sent), blocked under deny, sent under allow. Move mode is not destructive to the source file itself (only its documents relocate), so no destructive confirmation is needed beyond the standard write policy.

  - id: F14
    title: Find documents in a file
    composite: find_documents
    purpose: >-
      Find the documents inside one file, optionally narrowed to certain document type codes
      and/or a description substring. The file is found by its number and, when a drawer code is
      given, checked to sit in that drawer.
    surface: rest-v1
    inputs:
      - name: fileNumber
        type: string
        required: true
        meaning: >-
          First part of the file number (FileNumberPart1) of the file to search in.
      - name: drawerCode
        type: string
        required: false
        meaning: >-
          Optional drawer code; when given, the file must sit in this drawer or the flow stops
          with an error.
      - name: docTypeCodes
        type: string[]
        required: false
        meaning: >-
          Optional document type codes (codes, not names or ids); only documents of these types
          are returned. Every code must resolve to a document type.
      - name: identifier
        type: string
        required: false
        meaning: >-
          Optional text matched against the document description as a contains (substring)
          match, not an exact match.
    steps:
      - op: POST /api/files/find
        purpose: Find the file to search in.
        params:
          FileNumberPart1: $input.fileNumber
        select: the single match; its Id is the file to search in
        onError: >-
          No match is an error, not a question - the flow stops with IR-4001 (ObjectNotFound,
          "no file has number <fileNumber>") and no documents are searched. More than one match
          is also an error - the flow stops with IR-4001 ("file number <fileNumber> matches more
          than one file") rather than guessing which file to search.
      - op: GET /api/drawers
        purpose: Turn the drawer code into the drawer id and check the file sits in that drawer.
        optional: only when $input.drawerCode is given
        params: {}
        select: >-
          the item whose Name (the drawer code) equals $input.drawerCode; its Id must equal
          $step1.DrawerId
        onError: >-
          No drawer with that code is an error - the flow stops with IR-4001 (ObjectNotFound, "no
          drawer has code <drawerCode>"). A file whose DrawerId differs from the drawer's Id is
          also an error - the flow stops with IR-4107 (InvalidTarget, "file <fileNumber> is not
          in drawer <drawerCode>") and no documents are searched.
      - op: GET /api/objecttypes/{standardObjectClass}
        purpose: Turn the document type codes into document type ids.
        optional: only when $input.docTypeCodes is given
        params:
          standardObjectClass: Document
        select: >-
          for each code in $input.docTypeCodes, the item whose code matches it; their Ids are the
          document type ids to filter on. Validation needed - which ObjectTypeDataResult field
          (Name, Description or AutomationId) holds the type code is unconfirmed.
        onError: >-
          A code that matches no document type is an error - the flow stops with IR-4006
          (TypeNotFound, "no document type has code <code>", naming every unknown code) and no
          documents are searched.
      - op: POST /api/documents/find
        purpose: Search the file for matching documents.
        params:
          FileId: $step1.Id
          DocumentTypeIds: $step3.Id of every resolved type when $input.docTypeCodes is given, otherwise left out
          Description: $input.identifier, left out when not given
          Deleted: false
        select: >-
          all items, returned as the DocumentDataResult list; zero matches is a normal empty
          result, not an error
        onError: >-
          Validation needed - whether the server treats Description as a contains or an exact
          match is unconfirmed; if it matches exactly, the composite leaves Description out and
          keeps only the documents whose Description contains $input.identifier as a substring.
    outputs:
      documents: $step4.value
    notes:
      - The file lookup must resolve to exactly one file; no match or more than one match is an error (IR-4001). The user is not asked to pick.
      - Drawers have no separate code field; the drawer code is assumed to be the drawer's Name, as in F9. The drawer check compares the found file's DrawerId with the drawer's Id; a mismatch is an error (IR-4107), not an empty result.
      - Validation needed - found documents only carry DocumentTypeId and DocumentTypeDescription, so type codes are turned into ids via GET /api/objecttypes/Document; which object type field holds the code must be confirmed on a test server. An unknown code is an error (IR-4006) naming the code.
      - Validation needed - identifier is meant as a contains (substring) match on the document description, but the server-side semantics of Description (exact vs contains) are unconfirmed on a real server. If the server matches exactly, the composite must filter client-side instead.
      - Deleted documents are never returned (Deleted is always sent as false).
      - Zero matching documents returns an empty list, not an error.
      - Every step is a read; no write policy applies.
